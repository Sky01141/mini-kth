  if(L.skin){const im=new Image(),t=new THREE.Texture();t.magFilter=t.minFilter=THREE.NearestFilter;im.onload=()=>{t.image=im;t.needsUpdate=true};im.src=L.skin;sm=new THREE.MeshBasicMaterial({map:t,transparent:true,alphaTest:.1})}

  const piv=(par,x,y,m,dy,ov)=>{const q=new THREE.Group();q.position.set(x,y,0);m.position.y=dy;q.add(m);if(ov){ov.position.y=dy;q.add(ov)}par.add(q);return q};
  const hc=!sm&&L.hood?(L.hoodc||'#c0392b'):null,hb=(w,h,d,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({color:hc}));m.position.set(x,y,z);return m};
  const up=new THREE.Group();up.position.y=.675;g.add(up);
  const legR=piv(g,.1125,.675,bm(4,12,4,0,16,L.pants),-.3375,sm?bm(4,12,4,0,32,0,1):null),legL=piv(g,-.1125,.675,bm(4,12,4,16,48,L.pants),-.3375,sm?bm(4,12,4,0,48,0,1):null);
  const body=bm(8,12,4,16,16,L.shirt);body.position.y=.3375;up.add(body);if(sm){const o=bm(8,12,4,16,32,0,1);o.position.y=.3375;up.add(o)}
  const armR=piv(up,.3375,.675,bm(4,12,4,40,16,L.skin),-.3375,sm?bm(4,12,4,40,32,0,1):hc?hb(.26,.72,.27,0,0,0):null),armL=piv(up,-.3375,.675,bm(4,12,4,32,48,L.skin),-.3375,sm?bm(4,12,4,48,48,0,1):hc?hb(.26,.72,.27,0,0,0):null);
  const head=bm(8,8,8,0,0,L.skin);head.position.y=.9;up.add(head);if(sm){const o=bm(8,8,8,32,0,0,1);o.position.y=.9;up.add(o)}
  if(hc){up.add(hb(.5,.72,.27,0,.3375,0));up.add(hb(.5,.12,.5,0,.69,0));up.add(hb(.5,.4,.12,0,.95,.2))}
  if(!sm){const bx=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({color:c}));m.position.set(x,y,z);up.add(m)};
    bx(.08,.06,.02,'#222',-.1,.925,-.226);bx(.08,.06,.02,'#222',.1,.925,-.226);if(L.style){bx(.49,.1,.49,L.hair,0,1.125,0);if(L.style==2)bx(.49,.45,.08,L.hair,0,.875,.2)}}
  const lb=label(p.name);lb.position.y=2.1;g.add(lb);g.userData={up,legR,legL,armR,armL,lb};return g}
function addP(p){const o=others.get(p.id);if(o)scene.remove(o.g);const g=model(p);scene.add(g);g.position.set(p.x,p.y,p.z);others.set(p.id,{g,p,t:o?o.t:{x:p.x,y:p.y,z:p.z,ry:p.ry||0}})}
function resetWorld(s){pend.clear();seed=s;edits.clear();chunks.clear();for(const m of meshes.values()){scene.remove(m);m.geometry.dispose()}meshes.clear();spawn()}
const send=o=>ws&&ws.readyState==1&&ws.send(JSON.stringify(o));
function onMsg(e){const m=JSON.parse(e.data);
  if(m.t=='init'){myId=m.id;isOp=!!m.op;seed=m.seed;worldName=m.world;m.edits.forEach(a=>edits.set(a[0]+','+a[1]+','+a[2],a[3]));spawn();loadPl();setWeather(m.weather);m.players.forEach(addP);mkSelf();ready=true;setMode(mode);(m.chat||[]).forEach(c=>say(fmt(c)));$('cs').textContent=`ワールド「${worldName}」 シード: ${seed}`}
  else if(m.t=='join')addP(m);else if(m.t=='pos'){const o=others.get(m.id);if(o)o.t={x:m.x,y:m.y,z:m.z,ry:m.ry,s:m.s,d:m.d}}
  else if(m.t=='look'){const o=others.get(m.id);if(o)addP({...o.p,look:m.look,...o.t})}
  else if(m.t=='set')setB(m.x,m.y,m.z,m.b,0);else if(m.t=='leave'){const o=others.get(m.id);if(o){scene.remove(o.g);others.delete(m.id)}}
  else if(m.t=='chat')say(fmt(m));else if(m.t=='dmg')hurt(m.n);else if(m.t=='weather'){setWeather(m.w);say(m.w=='rain'?'雨が降り始めた':'天気が回復した')}
  else if(m.t=='opres'){if(m.ok){isOp=true;if($('adk').style.display=='block')show('adm');else say('管理者権限を取得しました')}else{$('ast').textContent=m.limited?'試行が多すぎます。少し待ってください':'パスワードが違います';if($('adk').style.display!='block')say('パスワードが違います')}}
  else if(m.t=='kick'){ready=false;alert('管理者によりキックされました')}
  else if(m.t=='rel')onRel(m);
  else if(m.t=='reload')location.reload();
  else if(m.t=='export'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(m.data)],{type:'application/json'}));a.download=(m.name||'world')+'.json';a.click()}
  else if(m.t=='world'){resetWorld(m.seed);$('cs').textContent=`ワールド「${worldName}」 シード: ${seed}`;say('ワールドが作り直されました。シード: '+seed)}}
setInterval(()=>{if(ready)send({t:'pos',x:+pos.x.toFixed(2),y:+pos.y.toFixed(2),z:+pos.z.toFixed(2),ry:+yaw.toFixed(2),s:sneak?1:0,d:swingT>0?1:0})},50);
// タッチ

  js.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier==jid){let dx=(t.clientX-jo[0])/40,dy=(t.clientY-jo[1])/40;const l=Math.max(1,Math.hypot(dx,dy));dx/=l;dy/=l;jx=dx;jy=-dy;kn.style.transform=`translate(${dx*30}px,${dy*30}px)`}e.preventDefault()},{passive:false});
  js.addEventListener('touchend',()=>{jid=null;jx=jy=0;kn.style.transform=''});
  cv.addEventListener('touchstart',e=>{const t=e.changedTouches[0];lid=t.identifier;lp=[t.clientX,t.clientY]});
  cv.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier==lid){yaw-=(t.clientX-lp[0])*.006*sens;pitch=Math.max(-1.55,Math.min(1.55,pitch-(t.clientY-lp[1])*.006*sens));lp=[t.clientX,t.clientY]}});
  $('tj').ontouchstart=e=>{jmp=true;e.preventDefault()};$('tj').ontouchend=()=>jmp=false;$('ts').onclick=()=>{snT=!snT;$('ts').style.background=snT?'#4a8':'#0008'};
  $('td').ontouchstart=e=>{act(0);e.preventDefault()};$('td').ontouchend=()=>{digging=false};$('tp').onclick=()=>act(2);$('ti').onclick=()=>{if(!invOpen)cr3=false;toggleInv()};$('tv').onclick=cycleCam;$('tch').onclick=()=>openChat();$('tm').onclick=()=>{playing=false;$('menu').style.display='flex';show('main')}}
// ---- ループ ----
let last=performance.now(),drops=Array.from({length:140},()=>({x:Math.random(),y:Math.random()}));
(function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.033);last=now;
  if(ready){if(active())move(dt);stream();ft+=dt;if(ft>.25){ft=0;fluidStep()}if(digging&&active())digTick(dt);else{mining=null;crack.visible=false}EYE.set(pos.x,pos.y+(sneak?1.37:1.62),pos.z);LD.set(-Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));
    if(camMode==0){cam.position.copy(EYE);cam.rotation.set(pitch,yaw,0)}else{const sg=camMode==1?-1:1;let t=.3;while(t<4&&!SOL(getB(Math.floor(EYE.x+LD.x*sg*(t+.25)),Math.floor(EYE.y+LD.y*sg*(t+.25)),Math.floor(EYE.z+LD.z*sg*(t+.25)))))t+=.2;
      cam.position.set(EYE.x+LD.x*sg*t,EYE.y+LD.y*sg*t,EYE.z+LD.z*sg*t);cam.rotation.set(camMode==1?pitch:-pitch,camMode==1?yaw:yaw+Math.PI,0)}
    {const mv=Math.hypot(pos.x-selfPX,pos.z-selfPZ);selfPX=pos.x;selfPZ=pos.z;selfPh+=mv*3;selfM.visible=camMode>0&&mode!=2;selfM.position.copy(pos);selfM.rotation.y=yaw;
      const U=selfM.userData,w=Math.sin(selfPh)*Math.min(1,mv*25)*.7;U.legR.rotation.x=w;U.legL.rotation.x=-w;U.armL.rotation.x=w;U.armR.rotation.x=swingT>0?-Math.abs(Math.sin(now/1000*12))*1.5-.3:-w;U.up.rotation.x=sneak?-.5:0;U.up.position.y=sneak?.6:.675}if(swingT>0){swingT-=dt;sw+=dt*14}else sw=0;{const a=Math.abs(Math.sin(sw));hand.rotation.x=-a*.9;hand.position.set(.32-a*.1,-.28-(sneak?.04:0)-a*.08,-.5);hand.visible=mode!=2&&camMode==0}
    const h=mode==2?null:ray();sel3.visible=!!h;if(h)sel3.position.set(h.x+.5,h.y+.5,h.z+.5);
    for(const o of others.values()){const k=Math.min(1,dt*12),g=o.g,ox=g.position.x,oz=g.position.z;g.position.x+=(o.t.x-ox)*k;g.position.y+=(o.t.y-g.position.y)*k;g.position.z+=(o.t.z-oz)*k;g.rotation.y=o.t.ry;
      const U=g.userData,mv=Math.hypot(g.position.x-ox,g.position.z-oz);o.ph=(o.ph||0)+mv*3;const w=Math.sin(o.ph)*Math.min(1,mv*25)*.7;
      U.legR.rotation.x=w;U.legL.rotation.x=-w;U.armL.rotation.x=w;U.armR.rotation.x=o.t.d?-Math.abs(Math.sin(now/1000*12))*1.5-.3:-w;

      const op=Math.max(0,Math.min(1,1-(g.position.distanceTo(cam.position)-8)/32));U.lb.material.opacity=op;U.lb.visible=op>.03}
    $('hud').textContent=`${worldName} | ${MODES[mode]} | ${BN[bio(Math.floor(pos.x),Math.floor(pos.z))]} | XYZ ${pos.x.toFixed(1)} ${pos.y.toFixed(1)} ${pos.z.toFixed(1)} | シード ${seed} | ${others.size+1}人${fly?' | 飛行':''}${sneak?' | スニーク':''}`}
  rg.clearRect(0,0,rc.width,rc.height);if(weather=='rain'){rg.strokeStyle='rgba(170,190,255,.55)';rg.beginPath();for(const d of drops){d.y+=dt*1.4;d.x-=dt*.1;if(d.y>1){d.y=0;d.x=Math.random()*1.1}const X=d.x*rc.width,Y=d.y*rc.height;rg.moveTo(X,Y);rg.lineTo(X-3,Y+16)}rg.stroke()}
  renderer.render(scene,cam)})(last);
